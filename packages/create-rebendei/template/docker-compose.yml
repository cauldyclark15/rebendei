services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rebendei
      POSTGRES_PASSWORD: rebendei
      POSTGRES_DB: rebendei
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebendei"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
