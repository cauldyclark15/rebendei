name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rebendei
          POSTGRES_PASSWORD: rebendei
          POSTGRES_DB: rebendei
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U rebendei" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
